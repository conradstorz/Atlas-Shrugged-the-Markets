name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      # --locked fails if uv.lock is stale. Atlas has already survived one
      # poisoned lockfile (see the pins in pyproject.toml); resolving fresh
      # dependencies in CI would silently defeat those pins.
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest
